services:

  # =========================
  # KAFKA
  # =========================
  kafka:
    image: apache/kafka:3.7.0
    container_name: icestream-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # =========================
  # MINIO - OBJECT STORAGE
  # =========================
  minio:
    image: minio/minio:latest
    container_name: icestream-minio
    hostname: minio
    networks:
      default:
        aliases:
          - warehouse.minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: icestreamadmin
    volumes:
      - minio_data:/data

  # =========================
  # ICEBERG REST CATALOG
  # =========================
  iceberg-rest:
    image: apache/iceberg-rest-fixture:latest
    container_name: icestream-iceberg-rest
    ports:
      - "8181:8181"
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: icestreamadmin
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"

  # =========================
  # FLINK JOBMANAGER
  # =========================
  flink-jobmanager:
    build:
      context: ./docker/flink
    container_name: icestream-flink-jobmanager
    ports:
      - "8081:8081"
      - "9250:9250"
    command: jobmanager
    environment:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: icestreamadmin
      AWS_EC2_METADATA_DISABLED: "true"
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.port: 8081
        security.module.factory.classes: org.apache.flink.runtime.security.modules.JaasModuleFactory
        metrics.reporters: prom
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9250

  # =========================
  # FLINK TASKMANAGER
  # =========================
  flink-taskmanager:
    build:
      context: ./docker/flink
    container_name: icestream-flink-taskmanager
    depends_on:
      - flink-jobmanager
    ports:
      - "9251:9250"
    command: taskmanager
    environment:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: icestreamadmin
      AWS_EC2_METADATA_DISABLED: "true"
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        security.module.factory.classes: org.apache.flink.runtime.security.modules.JaasModuleFactory
        metrics.reporters: prom
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9250
  # =========================
  # PROMETHEUS - METRICS
  # =========================
  prometheus:
    image: prom/prometheus:latest
    container_name: icestream-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - flink-jobmanager
      - flink-taskmanager
    # =========================
  # GRAFANA - DASHBOARDS
  # =========================
  grafana:
    image: grafana/grafana:latest
    container_name: icestream-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    
volumes:
  minio_data:
  grafana_data: